data:
  dataset: DAIR-V2X
  split: paper3737
  data_info_path: data/data_info_dair_paper3737.json
  data_root: data/DAIR-V2X/cooperative-vehicle-infrastructure
  detection_cache: data/DAIR-V2X/detected/paper3737_pp_dual/stage1_boxes.json
  use_detection: true
  detection_field: pred_corner3d_np_list
  noise:
    pos_std: 0
    rot_std: 0
  max_samples: null
filters:
  top_k: 15
  top_k_candidates: [15, 25, 30, 35]
  distance_m: 120
  priority_categories: [bus, truck, car]
  min_confidence: 0.3
matching:
  strategy: ['category', 'core']
  core_components: ['centerpoint_distance', 'vertex_distance']
  filter_strategy: thresholdRetained
  filter_threshold: 4
  matches2extrinsic: weightedSVD
  svd_strategy: svd_with_match
  resolve_180_ambiguity: false
  distance_thresholds:
    truck: 1.5
    van: 1.5
    bus: 1.5
    car: 1.0
    trafficcone: 0.5
    pedestrian: 0.5
    cyclist: 0.5
    motorcyclist: 0.5
    tricylist: 0.5
    barrawlist: 0.5
    detected: 1.2
  prior_weight: 0.0
  parallel_flag: false
  corresponding_parallel: false
solver:
  stability_gate: 1
  max_iterations: 2
  inlier_threshold_m: 1.0
  confidence_weight_exponent: 2.0
  confidence_weight_min: 0.0
  consistency_threshold_m: 1.5
  consistency_min_support: 2
  icp_refine_iters: 2
  icp_distance_threshold_m: 1.5
  icp_trim_ratio: 0.8
  icp_min_matches: 4
  icp_refine_on_solution: true
evaluation:
  success_thresholds: [1.0, 2.0, 3.0]
  time_verbose: false
output:
  root_dir: outputs
  tag: paper3737_pp15_pcalwh_topkCand15_25_30_35_confexp2_consistency1p5_icp
